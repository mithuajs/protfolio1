<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md. Mobasher Hosen Mithu — Frontend Developer</title>
    <meta
      name="description"
      content="Personal developer portfolio of Md. Mobasher Hosen Mithu, a Frontend Developer from Bangladesh specializing in React.js, Next.js, Tailwind CSS, and modern responsive web applications."
    />
    <meta property="og:title" content="Md. Mobasher Hosen Mithu — Frontend Developer" />
    <meta
      property="og:description"
      content="Building Modern, Responsive & User-Friendly Web Applications."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mithu-portfolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 dark:bg-[#050508] dark:text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-900 dark:selection:text-indigo-200 transition-colors duration-300">

    <script type="module" src="/src/main.tsx"></script>
  </body>
